<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tá Onde? — filmes nos streamings</title>
  <meta name="description" content="Descubra em qual streaming está o filme que você quer ver — incluindo o que dá para assistir de graça no Brasil.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header>
    <h1>Tá Onde?</h1>
    <p class="subtitulo">Onde assistir um filme hoje no Brasil — e o que dá pra ver de graça</p>

    <div class="busca">
      <input id="f-busca" type="search" autocomplete="off"
             placeholder="Buscar um filme pelo nome">
    </div>
  </header>

  <div class="separador"><span>ou navegue por serviço</span></div>

  <nav id="servicos" class="servicos" aria-label="Serviços de streaming"></nav>

  <main>
    <section id="filtros" class="filtros">
      <label>
        Gênero
        <select id="f-genero">
          <option value="">todos</option>
        </select>
      </label>

      <label>
        Ano
        <input id="f-ano" type="number" min="1900" max="2030" placeholder="qualquer">
      </label>

      <label>
        Nota mínima
        <input id="f-nota" type="number" min="0" max="10" step="0.5" placeholder="qualquer">
      </label>

      <button type="button" id="f-limpar">Limpar filtros</button>
    </section>

    <p id="modo-busca" class="modo-busca" hidden>
      <span id="modo-busca-texto"></span>
      <button type="button" id="sair-busca">Voltar ao catálogo</button>
    </p>

    <div id="aviso" class="aviso" hidden></div>
    <div id="grade" class="grade"></div>

    <div class="rodape-grade">
      <button type="button" id="mais" class="mais" hidden>Carregar mais</button>
      <p id="contagem" class="contagem"></p>
    </div>
  </main>

  <!-- Painel de detalhe. <dialog> é o elemento que o próprio navegador
       entende como painel sobreposto: ele já traz fundo escurecido,
       fechar com Esc e foco no lugar certo, sem a gente programar nada. -->
  <dialog id="detalhe" class="detalhe">
    <button type="button" id="fechar-detalhe" class="fechar">Fechar</button>
    <div id="detalhe-conteudo"></div>
  </dialog>

  <footer class="creditos">
    <img src="img/tmdb.svg" alt="The Movie Database" class="logo-tmdb">
    <p>This product uses TMDB and the TMDB APIs but is not endorsed, certified, or
       otherwise approved by TMDB.</p>
    <p>Dados de disponibilidade em streaming fornecidos por <strong>JustWatch</strong>.</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
