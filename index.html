<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de Filmes</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header>
    <h1>Catálogo de Filmes</h1>
  </header>

  <nav id="servicos" class="servicos" aria-label="Serviços de streaming"></nav>

  <main>
    <section id="filtros" class="filtros">
      <label>
        Gênero
        <select id="f-genero">
          <option value="">todos</option>
        </select>
      </label>

      <label>
        Ano
        <input id="f-ano" type="number" min="1900" max="2030" placeholder="qualquer">
      </label>

      <label>
        Nota mínima
        <input id="f-nota" type="number" min="0" max="10" step="0.5" placeholder="qualquer">
      </label>

      <button type="button" id="f-limpar">Limpar filtros</button>
    </section>

    <div id="aviso" class="aviso" hidden></div>
    <div id="grade" class="grade"></div>
  </main>

  <footer class="creditos">
    <p>This product uses TMDB and the TMDB APIs but is not endorsed, certified, or
       otherwise approved by TMDB.</p>
    <p>Dados de disponibilidade em streaming fornecidos por <strong>JustWatch</strong>.</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
